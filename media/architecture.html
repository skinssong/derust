<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<title>Derust — architecture</title>
<style>
:root{--ink:#1e2320;--paper:#f2f3ed;--paper2:#f8f6ee;--paper3:#ebe9dd;--line:#d1d2c5;--muted:#647064;--rust:#a8431f;--blue:#3f7f9f;--sage:#6c7d3d;--amber:#b4652f;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--mono:"SF Mono","Cascadia Code",Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:14px/1.45 var(--serif)}body{overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}.top{flex:0 0 58px;display:flex;align-items:center;gap:14px;padding:0 22px;background:#202520;color:var(--paper);border-bottom:3px solid var(--rust)}.brand{font-size:19px;font-style:italic}.brand b{font-style:normal;color:#f6e2d5}.badge{font:10px var(--mono);border:1px solid #71523f;color:#d9bfae;padding:3px 6px}.stats{margin-left:auto;font:10px var(--mono);color:#bcc5b9}
.tabs{flex:0 0 34px;display:flex;gap:0;padding:0 16px;background:var(--paper2);border-bottom:1px solid var(--line)}.tabs button{font:10px var(--mono);text-transform:lowercase;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 12px;cursor:pointer}.tabs button.active{color:var(--rust);border-bottom-color:var(--rust)}.tabs button:hover{color:var(--ink)}
.docPane{flex:1;min-height:0;overflow:auto;background:var(--paper);padding:30px 7vw 60px}.docPane[hidden]{display:none!important}.docPane article{max-width:860px;margin:0 auto}.docPane .side-title{font-size:26px;line-height:1.15;margin:0 0 4px}.docPane .side-path{margin-bottom:18px}.docPane .section h3{margin-top:0}
.side-title{font-size:20px;line-height:1.2;margin:0 0 4px;overflow-wrap:anywhere}.side-path{font:10px var(--mono);color:var(--muted);overflow-wrap:anywhere}.side-copy{color:#505a50;font-size:13px;margin:12px 0}
.section{border-top:1px solid var(--line);margin-top:16px;padding-top:10px}.section h3{font:10px var(--mono);font-weight:600;color:var(--muted);margin:0 0 8px;text-transform:lowercase}
.brief-purpose{font-size:13px;line-height:1.5;color:#3f4a40;margin:10px 0}.brief-purpose strong{font:10px var(--mono);font-weight:600;color:var(--muted);text-transform:lowercase}.brief-item{display:block;width:100%;text-align:left;border:0;border-top:1px solid #e3e1d5;background:transparent;padding:7px 0;cursor:pointer;color:var(--ink)}.brief-item:hover{background:var(--paper3)}.brief-name{font:11px var(--mono);font-weight:600}.brief-doc{display:block;font-size:12px;color:#505a50;margin-top:2px}.brief-meta{display:block;font:9px var(--mono);color:var(--muted);margin-top:3px}.carrier{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #e3e1d5;padding:6px 0}.carrier-meta{font:9px var(--mono);color:var(--muted)}.note{font:10px var(--mono);color:var(--muted);margin:6px 0;line-height:1.5}.empty{font-size:12px;color:var(--muted);font-style:italic}
.flowWrap{overflow:auto;border:1px solid var(--line);background:var(--paper2);padding:14px;margin:14px 0}.flowSvg{display:block;max-width:none}.flowActions{margin-top:14px}.flowStageRow{border-top:1px solid #e3e1d5;padding:8px 0}.flowStageRow .carrier-meta{margin-left:8px}
.readingStep{display:flex;gap:14px;border-top:1px solid #e3e1d5;padding:14px 0}.readingStep .stepNo{font:11px var(--mono);color:var(--rust);min-width:22px;padding-top:2px}.readingStep .stepBody{flex:1;min-width:0}.readingStep .brief-doc{margin-top:3px}.readingFiles{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.readingFiles button{font:10px var(--mono);background:transparent;border:1px solid var(--line);color:var(--ink);padding:4px 7px;cursor:pointer}.readingFiles button:hover{border-color:var(--rust);color:var(--rust)}
@media(max-width:850px){body{overflow:auto}.app{height:auto;min-height:100vh}.stats{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><b>Derust</b> Architecture</div><span class="badge">workspace</span><div class="stats" id="stats"></div></header>
<nav class="tabs" id="tabs"><button data-tab="overview" class="active">overview</button><button data-tab="flow">flow</button><button data-tab="reading">reading</button></nav>
<section class="docPane" id="overviewPane"><article id="overviewDoc"></article></section>
<section class="docPane" id="flowPane" hidden><article id="flowDoc"></article></section>
<section class="docPane" id="readingPane" hidden><article id="readingDoc"></article></section>
</div>
<script nonce="__NONCE__">
const DATA = __DATA__;
const NARRATIVE = __NARRATIVE__;
const FLOW = __FLOW__;
const READING = __READING__;
let reading = READING;
let readingError = null;
let flow = FLOW;
let flowError = null;
let narrative = NARRATIVE;
let narrativeError = null;
const vscodeApi = typeof acquireVsCodeApi === 'function' ? acquireVsCodeApi() : null;

const stats = document.getElementById('stats');
stats.textContent = `${DATA.meta.crate ? DATA.meta.crate + ' · ' : ''}${DATA.meta.components} components · ${DATA.meta.indexedReferences} indexed references · ${DATA.meta.edges} links · rev ${String(DATA.meta.revision).slice(0, 16)}`;

function el(tag, cls, text) { const n=document.createElement(tag); if(cls)n.className=cls; if(text!==undefined)n.textContent=text; return n; }
function postOpen(file){
  if (vscodeApi && file) vscodeApi.postMessage({ type: 'openModule', file });
}
function renderNarrativeSection(){
  const section=el('section','section');
  section.append(el('h3',null,'deeper dive'));
  if(narrative && narrative.text){
    for(const paragraph of String(narrative.text).split(/\n{2,}/)){
      if(paragraph.trim()) section.append(el('p','brief-purpose',paragraph.trim()));
    }
    if(narrative.generatedAt){
      section.append(el('p','note','generated from the source excerpts and facts · '+new Date(narrative.generatedAt).toLocaleString()));
    }
    return section;
  }
  const button=el('button','brief-item','analyze the code');
  button.addEventListener('click',()=>{
    if(!vscodeApi) return;
    vscodeApi.postMessage({type:'writeNarrative'});
    button.textContent='writing…';
    button.disabled=true;
  });
  section.append(el('p','note','Reads the source excerpts supplied with this brief (comments blanked) and writes this section in depth.'),button);
  if(narrativeError) section.append(el('p','note',narrativeError));
  return section;
}
let activeTab = 'overview';
const overviewPane = document.getElementById('overviewPane');
const overviewDoc = document.getElementById('overviewDoc');
const flowPane = document.getElementById('flowPane');
const flowDoc = document.getElementById('flowDoc');
const readingPane = document.getElementById('readingPane');
const readingDoc = document.getElementById('readingDoc');
const tabs = document.getElementById('tabs');
function setTab(name){
  activeTab = name;
  overviewPane.hidden = name !== 'overview';
  flowPane.hidden = name !== 'flow';
  readingPane.hidden = name !== 'reading';
  for(const button of tabs.querySelectorAll('button')){
    button.classList.toggle('active', button.dataset.tab === name);
  }
  if(name === 'overview') renderOverview();
  if(name === 'flow') renderFlow();
  if(name === 'reading') renderReading();
}
tabs.addEventListener('click',(event)=>{
  const button = event.target.closest('button[data-tab]');
  if(button) setTab(button.dataset.tab);
});
function renderOverview(){
  const brief = DATA.brief;
  overviewDoc.textContent='';
  overviewDoc.append(el('div','side-title', DATA.meta.crate || 'project'));
  overviewDoc.append(el('div','side-path','architecture brief · derived from the code'));
  if(!brief){
    overviewDoc.append(el('p','side-copy','No brief is stored in this model; run Analyze Architecture again.'));
    return;
  }
  const overview = brief.overview || {};
  const identity = overview.identity || overview.what;
  if(identity){
    const paragraph=el('p','brief-purpose');
    paragraph.append(el('strong',null,'what it is: '),document.createTextNode(identity));
    overviewDoc.append(paragraph);
  }
  if(overview.evidence && overview.evidence.length){
    overviewDoc.append(el('p','note','inferred from: '+overview.evidence.join(', ')));
  }
  overviewDoc.append(renderNarrativeSection());
}
function wrapFlowTitle(title){
  const words = String(title).split(/\s+/);
  const lines = [];
  let current = '';
  for(const word of words){
    if((current + ' ' + word).trim().length > 24 && current){ lines.push(current); current = word; }
    else current = (current + ' ' + word).trim();
    if(lines.length === 2) break;
  }
  if(current && lines.length < 2) lines.push(current);
  return lines.length ? lines : [String(title)];
}
function buildFlowSvg(spec){
  const NS='http://www.w3.org/2000/svg';
  const stages = spec.stages || [];
  const edges = spec.edges || [];
  const ids = stages.map(s=>s.id);
  const succ = new Map(ids.map(id=>[id,[]]));
  const pred = new Map(ids.map(id=>[id,[]]));
  for(const edge of edges){
    if(!succ.has(edge.from) || !succ.has(edge.to)) continue;
    succ.get(edge.from).push(edge.to);
    pred.get(edge.to).push(edge.from);
  }
  const visited = new Set(); const onPath = new Set(); const back = new Set();
  const dfs = (id)=>{
    visited.add(id); onPath.add(id);
    for(const next of succ.get(id) || []){
      const key = id + '->' + next;
      if(onPath.has(next)){ back.add(key); continue; }
      if(!visited.has(next)) dfs(next);
    }
    onPath.delete(id);
  };
  for(const id of ids){ if(!visited.has(id)) dfs(id); }
  const indeg = new Map(ids.map(id=>[id,0]));
  for(const edge of edges){
    if(back.has(edge.from + '->' + edge.to) || !indeg.has(edge.to)) continue;
    indeg.set(edge.to, indeg.get(edge.to) + 1);
  }
  const rank = new Map(ids.map(id=>[id,0]));
  const queue = ids.filter(id=>indeg.get(id) === 0);
  while(queue.length){
    const current = queue.shift();
    for(const next of succ.get(current) || []){
      if(back.has(current + '->' + next)) continue;
      rank.set(next, Math.max(rank.get(next), rank.get(current) + 1));
      indeg.set(next, indeg.get(next) - 1);
      if(indeg.get(next) === 0) queue.push(next);
    }
  }
  const columns = new Map();
  for(const id of ids){
    const r = rank.get(id);
    if(!columns.has(r)) columns.set(r, []);
    columns.get(r).push(id);
  }
  const W = 200, H = 58, STEP_X = 240, STEP_Y = 104;
  const pos = new Map();
  for(const [r, list] of columns){
    list.forEach((id, i)=>{
      pos.set(id, { x: 40 + i * STEP_X, y: 30 + r * STEP_Y });
    });
  }
  const maxRank = Math.max(...columns.keys());
  const maxRows = Math.max(...Array.from(columns.values()).map(list=>list.length));
  const width = 40 + (maxRows - 1) * STEP_X + W + 40;
  const height = 30 + maxRank * STEP_Y + H + 40;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
  svg.setAttribute('width', String(width));
  svg.setAttribute('height', String(height));
  svg.setAttribute('class', 'flowSvg');
  const defs = document.createElementNS(NS, 'defs');
  defs.innerHTML = '<marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a8431f"/></marker>';
  svg.append(defs);
  for(const edge of edges){
    const a = pos.get(edge.from), b = pos.get(edge.to);
    if(!a || !b) continue;
    const ax = a.x + W/2, ay = a.y + H, bx = b.x + W/2, by = b.y;
    let d, lx, ly;
    if(b.y > a.y){
      const mid = (ay + by) / 2;
      d = 'M ' + ax + ' ' + ay + ' L ' + ax + ' ' + mid + ' L ' + bx + ' ' + mid + ' L ' + bx + ' ' + by;
      lx = (ax + bx) / 2; ly = mid - 6;
    } else {
      const x = Math.max(a.x, b.x) + W + 26;
      const aMid = a.y + H/2, bMid = b.y + H/2;
      d = 'M ' + (a.x + W) + ' ' + aMid + ' L ' + x + ' ' + aMid + ' L ' + x + ' ' + bMid + ' L ' + (b.x + W) + ' ' + bMid;
      lx = x + 6; ly = (aMid + bMid) / 2;
    }
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', b.y > a.y ? '#a8431f' : '#b4652f');
    if(b.y <= a.y) path.setAttribute('stroke-dasharray', '4 3');
    path.setAttribute('stroke-width', '1.2');
    path.setAttribute('marker-end', 'url(#flowArrow)');
    svg.append(path);
    if(edge.label){
      const text = document.createElementNS(NS, 'text');
      text.setAttribute('x', lx); text.setAttribute('y', ly);
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('font-family', 'ui-monospace, Menlo, monospace');
      text.setAttribute('font-size', '9');
      text.setAttribute('fill', '#596054');
      text.textContent = edge.label;
      svg.append(text);
    }
  }
  for(const stage of stages){
    const p = pos.get(stage.id);
    if(!p) continue;
    const group = document.createElementNS(NS, 'g');
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', p.x); rect.setAttribute('y', p.y);
    rect.setAttribute('width', W); rect.setAttribute('height', H);
    rect.setAttribute('rx', stage.kind === 'decision' ? '12' : '4');
    const fill = stage.kind === 'input' || stage.kind === 'output' ? '#f8f6ee' : stage.kind === 'decision' ? '#fbf3e4' : stage.kind === 'halt' ? '#f2f2ec' : '#ffffff';
    const stroke = stage.kind === 'decision' ? '#b4652f' : stage.kind === 'halt' ? '#9e9e9e' : stage.kind === 'input' || stage.kind === 'output' ? '#a8431f' : '#202520';
    rect.setAttribute('fill', fill); rect.setAttribute('stroke', stroke);
    rect.setAttribute('stroke-width', stage.kind === 'halt' ? '1' : '1.4');
    if(stage.kind === 'halt') rect.setAttribute('stroke-dasharray', '4 3');
    group.append(rect);
    const lines = wrapFlowTitle(stage.title);
    lines.forEach((line, index)=>{
      const text = document.createElementNS(NS, 'text');
      text.setAttribute('x', p.x + W/2);
      text.setAttribute('y', p.y + H/2 - (lines.length - 1) * 7 + index * 14 + 4);
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('font-family', 'ui-monospace, Menlo, monospace');
      text.setAttribute('font-size', '11');
      text.setAttribute('fill', '#1e2320');
      text.textContent = line;
      group.append(text);
    });
    const kindText = document.createElementNS(NS, 'text');
    kindText.setAttribute('x', p.x + W/2);
    kindText.setAttribute('y', p.y + H - 8);
    kindText.setAttribute('text-anchor', 'middle');
    kindText.setAttribute('font-family', 'ui-monospace, Menlo, monospace');
    kindText.setAttribute('font-size', '8');
    kindText.setAttribute('fill', stage.source ? '#4c544a' : '#92998f');
    const label = stage.source || stage.kind;
    kindText.textContent = label.length > 34 ? '…' + label.slice(-33) : label;
    group.append(kindText);
    const title = document.createElementNS(NS, 'title');
    const titleParts = [stage.title];
    if(stage.source) titleParts.push('handled by ' + stage.source);
    if(stage.detail) titleParts.push(stage.detail);
    title.textContent = titleParts.join(' — ');
    group.append(title);
    if(stage.source && stage.file){
      group.style.cursor = 'pointer';
      group.addEventListener('click', () => {
        if(vscodeApi) vscodeApi.postMessage({ type: 'reveal', root: DATA.meta.root, file: stage.file, line: stage.line || 1 });
      });
    }
    svg.append(group);
  }
  return svg;
}
function renderFlow(){
  flowDoc.textContent='';
  flowDoc.append(el('div','side-title', DATA.meta.crate || 'project'));
  flowDoc.append(el('div','side-path','execution flow · one normal run'));
  if(!flow){
    flowDoc.append(el('p','side-copy','Draw the steps of one normal run: what comes in, how it is enriched, where it leaves the process via the provider, how the reply is parsed, and how the run ends. Each stage names the module that does its work.'));
    if(flowError) flowDoc.append(el('p','note',flowError));
    const button=el('button','brief-item','draw the run');
    button.addEventListener('click',()=>{
      if(!vscodeApi) return;
      vscodeApi.postMessage({type:'writeFlow'});
      button.textContent='drawing…';
      button.disabled=true;
    });
    flowDoc.append(button);
    return;
  }
  flowDoc.append(el('p','note','Drawn from the code. The label under each stage is the module that does the work; click a stage to open it. ' + (flow.generatedAt ? 'Generated ' + new Date(flow.generatedAt).toLocaleString() + '.' : '')));
  const wrap=el('div','flowWrap'); wrap.append(buildFlowSvg(flow)); flowDoc.append(wrap);
  const list=el('section','section'); list.append(el('h3',null,'stages'));
  for(const stage of flow.stages){
    const row=el('div','flowStageRow');
    row.append(el('span','brief-name',stage.title));
    const where=el('span','carrier-meta',stage.source || stage.kind);
    if(stage.source && stage.file){
      where.style.cursor='pointer';
      where.title='Open in editor';
      where.addEventListener('click',()=>{ if(vscodeApi) vscodeApi.postMessage({ type: 'reveal', root: DATA.meta.root, file: stage.file, line: stage.line || 1 }); });
    }
    row.append(where);
    if(stage.detail) row.append(el('p','note',stage.detail));
    list.append(row);
  }
  flowDoc.append(list);
  const actions=el('div','flowActions');
  const redraw=el('button','brief-item','redraw');
  redraw.addEventListener('click',()=>{
    if(!vscodeApi) return;
    vscodeApi.postMessage({type:'writeFlow'});
    redraw.textContent='drawing…';
    redraw.disabled=true;
  });
  actions.append(redraw); flowDoc.append(actions);
  if(flowError) flowDoc.append(el('p','note',flowError));
}
function renderReading(){
  readingDoc.textContent='';
  readingDoc.append(el('div','side-title', DATA.meta.crate || 'project'));
  readingDoc.append(el('div','side-path','reading order · one normal run'));
  if(!reading){
    readingDoc.append(el('p','side-copy','Plan an order for reading one normal run: entry and dispatch, the loop, one provider exchange, tool dispatch, recording, then replay and resume. Only the order, with the files each step needs.'));
    if(readingError) readingDoc.append(el('p','note',readingError));
    const button=el('button','brief-item','suggest a reading order');
    button.addEventListener('click',()=>{
      if(!vscodeApi) return;
      vscodeApi.postMessage({type:'writeReading'});
      button.textContent='planning…';
      button.disabled=true;
    });
    readingDoc.append(button);
    return;
  }
  readingDoc.append(el('p','note','A suggested order, not a catalog. Each file opens in the editor.'));
  reading.steps.forEach((step, index)=>{
    const row=el('div','readingStep');
    const no=el('div','stepNo',String(index+1).padStart(2,'0'));
    const body=el('div','stepBody');
    body.append(el('div','brief-name',step.title));
    if(step.why) body.append(el('div','brief-doc',step.why));
    const files=el('div','readingFiles');
    for(const file of step.files){
      const button=el('button',null,file);
      button.title='Open ' + file;
      button.addEventListener('click',()=>postOpen(file));
      files.append(button);
    }
    body.append(files);
    row.append(no, body);
    readingDoc.append(row);
  });
  const actions=el('div','flowActions');
  const redraw=el('button','brief-item','replan');
  redraw.addEventListener('click',()=>{
    if(!vscodeApi) return;
    vscodeApi.postMessage({type:'writeReading'});
    redraw.textContent='planning…';
    redraw.disabled=true;
  });
  actions.append(redraw); readingDoc.append(actions);
  if(readingError) readingDoc.append(el('p','note',readingError));
}

window.addEventListener('message',(event)=>{
  const message = event.data;
  if(!message || typeof message !== 'object') return;
  if(message.type === 'narrative' && typeof message.text === 'string'){
    narrative = { text: message.text, generatedAt: message.generatedAt };
    narrativeError = null;
    if(activeTab === 'overview') renderOverview();
  } else if(message.type === 'narrativeError' && typeof message.message === 'string'){
    narrativeError = message.message;
    if(activeTab === 'overview') renderOverview();
  } else if(message.type === 'flow' && message.flow){
    flow = message.flow; flowError = null;
    if(activeTab === 'flow') renderFlow();
  } else if(message.type === 'flowError' && typeof message.message === 'string'){
    flowError = message.message;
    if(activeTab === 'flow') renderFlow();
  } else if(message.type === 'reading' && message.reading){
    reading = message.reading; readingError = null;
    if(activeTab === 'reading') renderReading();
  } else if(message.type === 'readingError' && typeof message.message === 'string'){
    readingError = message.message;
    if(activeTab === 'reading') renderReading();
  }
});

setTab('overview');
</script>
</body>
</html>
